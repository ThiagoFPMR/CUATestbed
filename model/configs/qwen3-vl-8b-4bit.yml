# Model and Finetuning Configuration

base_model: "unsloth/Qwen3-VL-8B-Instruct-unsloth-bnb-4bit"

quantization:
  max_seq_length: 8192 # Affects RoPE scaling, memory use, KV cache size, etc 
  lora_rank: 16
  fp_precision: 4 # 4bit QLoRA, 8bit LoRA, or 16bit LoRA
  full_finetuning: false
  qat_scheme: "none" # TODO: Look further into QAT schemes
  use_vllm: true
  gpu_memory_utilization: 0.5 # Only with vLLM. Colocate mode: fraction vLLM grabs
    # for weights + KV cache; the rest must hold the trainable model, grads,
    # optimizer state and activations. 0.5 is a safe start on big cards — raise
    # toward 0.7 if training has headroom, lower if generation OOMs.

finetuning:
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  random_state: 3407
  use_rslora: false
  loftq_config: # Not to be used with quantized models, only full precision
    loftq_bits: 4
    loftq_iter: 0 # When 0, no LoFT-Q is applied
  task_type: "causal_lm" # causal_lm, seq2seq_lm, seq_cls, token_cls, question_ans, feature_extraction
  use_gradient_checkpointing: "unsloth"