# Model and Finetuning Configuration

base_model: "unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit"

quantization:
  max_seq_length: 16384 # Affects RoPE scaling, memory use, KV cache size, etc 
  lora_rank: 16
  fp_precision: 4 # 4bit QLoRA, 8bit LoRA, or 16bit LoRA
  full_finetuning: false
  qat_scheme: "none" # TODO: Look further into QAT schemes
  use_vllm: false
  gpu_memory_utilization: 0.8 # Only with vLLM

finetuning:
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  r: 16
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  random_state: 3407
  use_rslora: false
  loftq: false
  task_type: "causal_lm" # causal_lm, seq2seq_lm, seq_cls, token_cls, question_ans, feature_extraction
  grad_checkpointing: "unsloth"