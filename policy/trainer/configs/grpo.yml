# Trainer configuration for GRPO training
config_type: "GRPOConfig"
trainer_type: "GRPOTrainer"

# Training hyperparameters
learning_rate: 5e-6
adam_beta1: 0.9
adam_beta2: 0.99
weight_decay: 0.01
warmup_ratio: 0.1
lr_scheduler: "cosine"
optimizer: "adamw_8bit"
logging_steps: 1
log_completions: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
num_generations: 2
max_prompt_length: 1024
max_completion_length: 1024
num_train_epochs: 1
save_steps: 60
max_grad_norm: 0.1
report_to: "none"
importance_sampling_level: "token"
mask_truncated_completions: false
loss_type: "dr_grpo"